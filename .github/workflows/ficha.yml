name: Ficha de personagens
on:
  workflow_dispatch:
    inputs:
      conjunto:
        required: false
        default: ""
permissions:
  contents: write
jobs:
  ficha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONJUNTO: ${{ github.event.inputs.conjunto }}
        run: python -m fabrica.ficha ficha
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ficha-juca-${{ github.event.inputs.conjunto }}-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" ficha/*.png --title "Ficha da família do Juca" --notes "Desenhos para aprovação"
