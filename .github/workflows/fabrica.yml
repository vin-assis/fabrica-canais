name: Fabrica

on:
  schedule:
    # horários em UTC (Brasília = UTC-3). O vídeo fica pronto na madrugada para você aprovar de manhã.
    - cron: "0 7 * * 1,3,5"   # canal PT: seg, qua, sex 04:00 BRT
    - cron: "0 8 * * 2,4,6"   # canal EN: ter, qui, sáb 05:00 BRT
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal (pt, en, poder, explica)"
        required: true
        default: "pt"
      tema:
        description: "Tema específico (opcional)"
        required: false
        default: ""
      temas:
        description: "Vários temas de uma vez, separados por ; (cada um vira um vídeo, em paralelo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fabrica-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.p.outputs.lista }}
    steps:
      - id: p
        env:
          TEMA: ${{ github.event.inputs.tema }}
          TEMAS: ${{ github.event.inputs.temas }}
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          temas = [t.strip() for t in os.environ.get("TEMAS", "").split(";") if t.strip()]
          if not temas:
              temas = [os.environ.get("TEMA", "").strip()]
          print("lista=" + json.dumps(temas, ensure_ascii=False))
          PY

  produzir:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tema: ${{ fromJSON(needs.plano.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4

      - name: Qual canal
        id: canal
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "canal=${{ github.event.inputs.canal }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1,3,5" ]; then
            echo "canal=pt" >> $GITHUB_OUTPUT
          else
            echo "canal=en" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && break || sleep 20; done
          pip install -q -r requirements.txt
          curl -sSfL -o assets/fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true

      - name: Produzir vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IMAGENS_IA: ${{ vars.IMAGENS_IA || '0' }}   # 0 = sem imagem gerada por IA (não exige o aviso de conteúdo sintético)
          GEMINI_SEARCH_MODEL: ${{ vars.GEMINI_SEARCH_MODEL || 'gemini-3.8-flash' }}
          CANAL: ${{ steps.canal.outputs.canal }}
          TEMA: ${{ matrix.tema }}
        run: |
          if [ -n "$TEMA" ]; then
            python -m fabrica.main --canal "$CANAL" --tema "$TEMA"
          else
            python -m fabrica.main --canal "$CANAL"
          fi

      - name: Publicar pacote (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C=${{ steps.canal.outputs.canal }}
          TAG="$C-$(date -u +%Y%m%d-%H%M)-${{ strategy.job-index }}"
          TITLE=$(python -c "import json;print(json.load(open('dist/$C/metadata.json'))['titulo'])")
          gh release create "$TAG" dist/$C/* --title "[$C] $TITLE" --notes-file dist/$C/relatorio.md
          echo "Pacote: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY

      - name: Salvar histórico de temas
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add state/
          git commit -m "histórico: ${{ steps.canal.outputs.canal }} $(date -u +%F)" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((RANDOM % 20 + 5)); done
          echo "histórico não salvo (outro vídeo salvou ao mesmo tempo); os temas foram dados à mão" 
